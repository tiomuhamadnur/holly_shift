[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_tests.py"]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "migrations",
    "node_modules",
    "staticfiles",
    "media",
    "graphify-out",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

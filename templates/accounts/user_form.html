{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" data-theme="{{ user.theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if object %}{% trans "Edit user" %}{% else %}{% trans "New user" %}{% endif %} · Holly Shift</title>
</head>
<body>
  <main>
    <h1>{% if object %}{% trans "Edit user" %}{% else %}{% trans "New user" %}{% endif %}</h1>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">{% trans "Save" %}</button>
      <a href="{% url 'user_list' %}">{% trans "Cancel" %}</a>
    </form>
  </main>
</body>
</html>
